<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · {{brand.name}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05060A">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-tight/inter-tight-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-tight/inter-tight-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/parent.css">
  <style>
    .ko { display: grid; place-items: center; padding: 24px 16px; }
    .ko-card { width: min(100%, 460px); padding: 24px; }
    .ko-mark { width: 48px; height: 48px; }
  </style>
</head>
<body class="kp ko">
  <main class="ko-card kp-panel kp-stack">
    <img class="ko-mark" src="/assets/logo.svg" alt="" width="48" height="48">
    <div class="kp-stack-tight">
      <h1 class="kp-title">You're offline</h1>
      <p class="kp-lead">This device can't reach the family's video box right now. The videos live on that box, so they need a connection.</p>
    </div>
    <p class="kp-small">Check the Wi-Fi or mobile data, then try again. If you're away from home and the box is only on the home network, it will be back when you are.</p>
    <div class="kp-actions">
      <a class="kp-btn kp-btn-primary" href="/">Try again</a>
    </div>
  </main>
</body>
</html>
