services:
  kidtube:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/kidtube.sqlite
      PUBLIC_DIR: /app/public
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data:Z
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
