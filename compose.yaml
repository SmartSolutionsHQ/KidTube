# docker compose up -d, then open the link and enter the setup code from `docker logs kidtube`.
services:
  kidtube:
    build: .
    container_name: kidtube
    user: "${PUID:-1000}:${PGID:-1000}"
    # Optional: a first install needs no .env. Values here lock the matching settings.
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      HOST_PORT: "${HOST_PORT:-3000}"
      DATABASE_PATH: /data/kidtube.sqlite
      PUBLIC_DIR: /app/public
    ports:
      # Only this computer by default. HOST_BIND=0.0.0.0 opens it to your home network (plain http).
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      # A named volume by default. Installs that keep their data in a folder set KIDTUBE_DATA=./data.
      - ${KIDTUBE_DATA:-kidtube-data}:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  kidtube-data:
