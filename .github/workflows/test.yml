name: Validate KidTube
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: npm pack --dry-run
      # docs/plan, docs/superpowers, scripts/dev and .github are for maintainers, never for families.
      - name: No maintainer folders in the package
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.argv[1])[0].files.map(file => file.path);
            const leaked = files.filter(path => /^(?:docs\/(?:plan|superpowers)|scripts\/dev|\.github)\//.test(path) || /(?:^|\/)\.env$|\.sqlite$/.test(path));
            if (leaked.length) { console.error("Maintainer files in the package:\n" + leaked.join("\n")); process.exit(1); }
            console.log(files.length + " files, none for maintainers");
          ' "$RUNNER_TEMP/pack.json"
      - run: docker build -t kidtube:check .
      - name: No maintainer folders in the image
        run: docker run --rm --entrypoint sh kidtube:check -c 'test ! -e /app/scripts/dev && test ! -e /app/docs && test ! -e /app/test && test ! -e /app/.github'
      # A parent's first install: no .env, then docker compose up -d and the setup code in the log.
      - name: compose.yaml starts healthy, read-only and non-root, with no .env
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose logs kidtube | grep -q 'Setup code: KT-'
          test "$(docker compose exec -T kidtube id -u)" = 1000
          test "$(docker inspect kidtube --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          docker compose down -v
