<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parent dashboard · {{brand.name}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05060A">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/parent.css">
</head>
<body class="kp kd" data-title="Parent dashboard">
  <a class="kd-skip" href="#kd-main">Skip to the dashboard</a>
  <div class="kd-app" id="tza-root" data-state="loading">
    <header class="kd-top">
      <span class="kd-top-name" data-family-name>Parent dashboard</span>
      <button class="kp-btn kp-btn-small kd-menu" type="button" aria-expanded="false" aria-controls="kd-nav" hidden>Menu</button>
    </header>

    <nav class="kd-nav" id="kd-nav" aria-label="Dashboard">
      <p class="kd-nav-name" data-family-name>Parent dashboard</p>
      <ul class="kd-nav-list" id="kd-nav-list"></ul>
      <div class="kd-nav-foot">
        <p class="kp-small kd-who" id="kd-who"></p>
        <div class="kd-nav-links">
          <a href="/">Back to the videos</a>
          <a href="/install">Add to a home screen</a>
          <button class="kp-btn kp-btn-quiet" type="button" id="kd-signout" hidden>Sign out</button>
        </div>
        <span class="kd-credit">
          <span class="kd-credit-label">{{brand.name}} by</span>
          <img src="/assets/smart-solutions-logo-white-transparent.png" alt="Smart Solutions" width="150" height="31">
        </span>
      </div>
    </nav>

    <main class="kd-main" id="kd-main" tabindex="-1">
      <p class="kp-lead">Loading the parent dashboard.</p>
    </main>
  </div>
  <p class="kd-status" id="kd-status" role="status" aria-live="polite"></p>

  <noscript>
    <p class="kd-noscript">The parent dashboard needs JavaScript turned on.</p>
  </noscript>

  <script type="module" src="/js/parent/app.js"></script>
  <script type="module" src="/js/shell/pwa.js"></script>
</body>
</html>
