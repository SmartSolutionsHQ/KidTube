# HTTPS with Caddy: set SITE_URL=https://your.domain in .env first, then
# docker compose -f compose.yaml -f compose.https.yaml up -d
services:
  kidtube:
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      # Passed on so the app and Caddy agree even when SITE_URL comes from the shell instead of .env.
      SITE_URL: ${SITE_URL}
    # With TRUST_PROXY on, only Caddy may reach the app, so its port is not published on this computer.
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy needs only to bind ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env to your https:// address first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
