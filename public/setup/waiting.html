<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Almost ready · {{brand.name}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05060A">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/parent.css">
  <link rel="stylesheet" href="/setup/setup.css">
</head>
<body class="kp su">
  <div class="su-page">
    <header class="su-top">
      <span class="su-top-name">{{brand.name}}</span>
    </header>

    <main class="su-waiting kp-panel">
      <div class="kp-stack">
        <h1 class="kp-title">Still being set up</h1>
        <p class="kp-lead">
          A parent is setting up this family's channel. Come back a little later, or ask them
          to send you the link when it's ready.
        </p>
        <p class="kp-small">
          Setting it up yourself? <a href="/setup">Sign in to finish setup</a>.
        </p>
      </div>
    </main>

    <footer class="su-foot">
      <span class="su-credit">
        <span class="su-credit-label">{{brand.name}} by</span>
        <img src="/assets/smart-solutions-logo-white-transparent.png" alt="Smart Solutions" width="150" height="31">
      </span>
    </footer>
  </div>
</body>
</html>
