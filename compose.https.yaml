# HTTPS with Caddy: set SITE_URL=https://your.domain in .env first, then
# docker compose -f compose.yaml -f compose.https.yaml up -d
services:
  kidtube:
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env to your https:// address first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
