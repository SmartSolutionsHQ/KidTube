<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parent dashboard · {{brand.name}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0C10">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/page.css">
</head>
<body class="page hq-page" data-title="Parent dashboard">
  <main class="tza-wrap">
    <div class="tza-shell">
      <header class="tza-head">
        <h1 class="tza-brand">Parent dashboard</h1>
        <span class="tza-sub"><span data-site="name">{{brand.name}}</span> · Family controls</span>
      </header>
      <div id="tza-root" aria-live="polite"></div>
      <footer class="tza-foot">
        <a href="/">Back to the videos</a>
        <span>{{brand.name}} {{brand.endorsement}}</span>
      </footer>
    </div>
  </main>

  <script type="module" src="/js/shell/site.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
